<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Velas - Login</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='vela-logo-oficial.ico') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #1a1d20;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .login-card {
            background-color: #212529;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .brand-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.6rem;
        }
        
        /* Animação oficial da chama do Velas System */
        .chama-viva {
            color: #d4af37;
            display: inline-block;
            transform-origin: bottom center; 
            filter: url(#distorcao-fogo) drop-shadow(0 -2px 4px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 10px rgba(230, 126, 34, 0.5));
            animation: queima-velas 1.5s infinite ease-in-out alternate;
        }

        @keyframes queima-velas {
            0% {
                transform: scale(0.98, 1.02) skewX(-1deg);
            }
            30% {
                transform: scale(1.03, 0.96) skewX(1deg);
            }
            60% {
                transform: scale(0.96, 1.04) skewX(-0.5deg);
            }
            100% {
                transform: scale(1.02, 0.98) skewX(0.8deg);
            }
        }

        
        .alerta-erro-escuro {
            background-color: #4a0e13;
            border: 1px solid #842029;
            color: #ff9da5;
            border-radius: 8px;
        }

        
        .input-group {
            border-radius: 0.375rem;
            transition: all 0.2s ease;
        }
        .input-group-text {
            background-color: #1a1d20;
            border: 1px solid #343a40;
            color: #6c757d;
            transition: all 0.2s ease;
        }
        .form-control {
            background-color: #1a1d20;
            border: 1px solid #343a40;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .form-control::placeholder {
            color: #6c757d;
        }

        
        .input-group:focus-within {
            box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.25);
        }
        .input-group:focus-within .input-group-text {
            background-color: #1a1d20;
            border-color: #d4af37;
            color: #d4af37;
        }
        .input-group:focus-within .form-control {
            background-color: #1a1d20;
            border-color: #d4af37;
            color: #ffffff;
            box-shadow: none;
        }

        .btn-gold {
            background-color: #d4af37;
            color: #1a1d20;
            font-weight: 700;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-gold:hover {
            background-color: #e5c158;
            color: #1a1d20;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    
    <svg style="width: 0; height: 0; position: absolute;">
        <defs>
            <filter id="distorcao-fogo">
                <feTurbulence type="fractalNoise" baseFrequency="0.04 0.15" numOctaves="3" result="noise">
                    <animate attributeName="baseFrequency" values="0.04 0.15; 0.04 0.35; 0.04 0.15" dur="1.2s" repeatCount="indefinite" />
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-fire-flame-curved fa-2x chama-viva mb-2"></i>
            <div class="brand-title">Velas System</div>
            <p class="text-secondary small mt-1">Acesso Restrito ao Painel</p>
        </div>

        {% if erro %}
        <div class="alerta-erro-escuro py-2 px-3 mb-3 text-center small" role="alert">
            <i class="fa-solid fa-circle-exclamation me-1"></i> {{ erro }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small text-secondary">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="usuario" class="form-control" placeholder="Digite seu usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small text-secondary">Senha</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 py-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar no Sistema
            </button>
        </form>
    </div>

</body>
</html>
