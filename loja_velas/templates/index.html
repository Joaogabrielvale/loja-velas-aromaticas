<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Velas - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #212529; color: white; }
        .sidebar { width: 260px; height: 100vh; background-color: #1a1d20; border-right: 2px solid #d4af37; }
        .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; }
        .nav-link { color: #adb5bd !important; margin-bottom: 10px; font-size: 1.1rem; }
        .nav-link:hover { color: #d4af37 !important; background-color: rgba(255, 255, 255, 0.05); }
        .nav-link.active { background-color: #d4af37 !important; color: black !important; font-weight: bold; }
        .card-stat { transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        /* Animação de Fogo Realista com Turbulência SVG */
.chama-viva {
    color: #d4af37;
    display: inline-block;
    transform-origin: bottom center; /* Mantém o pé do fogo fixo na vela */
    
    /* Aplica a distorção fractal do SVG invisível, deformando o desenho */
    filter: url(#distorcao-fogo) drop-shadow(0 -2px 4px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 10px rgba(230, 126, 34, 0.5));
    
    /* Pulsação de tamanho de forma muito discreta e assimétrica */
    animation: queima-velas 1.5s infinite ease-in-out alternate;
}

@keyframes queima-velas {
    0% {
        transform: scale(0.98, 1.02) skewX(-1deg);
    }
    30% {
        transform: scale(1.03, 0.96) skewX(1deg);
    }
    60% {
        transform: scale(0.96, 1.04) skewX(-0.5deg);
    }
    100% {
        transform: scale(1.02, 0.98) skewX(0.8deg);
    }
}
    </style>
    <link rel="shortcut icon" href="{{ url_for('static', filename='vela-logo-oficial.ico') }}" type="image/x-icon">
</head>
<body class="d-flex">
    
    <!-- Menu Lateral -->
    <nav class="sidebar d-flex flex-column p-4">
        <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
    <span class="fs-4 fw-bold d-flex align-items-center">
        <!-- O ícone do fogo com a classe da chama viva -->
        <i class="fa-solid fa-fire-flame-curved me-2 chama-viva"></i> 
        Velas System
    </span>
</a>

<!-- Gerador invisível de turbulência que deforma o fogo de forma realista -->
<svg style="width: 0; height: 0; position: absolute;">
    <defs>
        <filter id="distorcao-fogo">
            <feTurbulence type="fractalNoise" baseFrequency="0.04 0.15" numOctaves="3" result="noise">
                <animate attributeName="baseFrequency" values="0.04 0.15; 0.04 0.35; 0.04 0.15" dur="1.2s" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </defs>
</svg>
        <hr class="text-secondary">
        <ul class="nav nav-pills flex-column mb-auto mt-2">
            <li><a href="/" class="nav-link active"><i class="fa-solid fa-chart-pie me-3"></i> Visão Geral</a></li>
            <li><a href="/cadastro" class="nav-link"><i class="fa-solid fa-plus me-3"></i> Cadastrar Vela</a></li>
            <li><a href="/estoque" class="nav-link"><i class="fa-solid fa-box-open me-3"></i> Estoque</a></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="main-content p-5">
        <div class="container">
            <h3 class="mb-4" style="color: #d4af37;"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</h3>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card shadow-lg border-0 card-stat" style="background-color: #2c2f33;">
                        <div class="card-body p-4 d-flex align-items-center">
                            <div class="rounded-circle d-flex align-items-center justify-content-center me-4" style="width: 70px; height: 70px; background-color: rgba(212, 175, 55, 0.2);">
                                <i class="fa-solid fa-boxes-stacked fa-2x" style="color: #d4af37;"></i>
                            </div>
                            <div>
                                <h5 class="text-secondary mb-1">Tipos de Velas Cadastradas</h5>
                                <h2 class="fw-bold mb-0 text-white">{{ total_velas }}</h2>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card shadow-lg border-0 card-stat" style="background-color: #2c2f33;">
                        <div class="card-body p-4 d-flex align-items-center">
                            <div class="rounded-circle d-flex align-items-center justify-content-center me-4" style="width: 70px; height: 70px; background-color: rgba(40, 167, 69, 0.2);">
                                <i class="fa-solid fa-sack-dollar fa-2x text-success"></i>
                            </div>
                            <div>
                                <h5 class="text-secondary mb-1">Valor Total em Estoque</h5>
                                <h2 class="fw-bold mb-0 text-success">R$ {{ "%.2f"|format(valor_estoque|float) }}</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
