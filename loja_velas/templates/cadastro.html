<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Velas - Cadastrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #212529; color: white; }
        .sidebar { width: 260px; height: 100vh; background-color: #1a1d20; border-right: 2px solid #d4af37; }
        .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; }
        .nav-link { color: #adb5bd !important; margin-bottom: 10px; font-size: 1.1rem; }
        .nav-link:hover { color: #d4af37 !important; background-color: rgba(255, 255, 255, 0.05); }
        .nav-link.active { background-color: #d4af37 !important; color: black !important; font-weight: bold; }
        
.chama-viva {
    color: #d4af37;
    display: inline-block;
    transform-origin: bottom center; 
    
    
    filter: url(#distorcao-fogo) drop-shadow(0 -2px 4px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 10px rgba(230, 126, 34, 0.5));
    
    
    animation: queima-velas 1.5s infinite ease-in-out alternate;
}

@keyframes queima-velas {
    0% {
        transform: scale(0.98, 1.02) skewX(-1deg);
    }
    30% {
        transform: scale(1.03, 0.96) skewX(1deg);
    }
    60% {
        transform: scale(0.96, 1.04) skewX(-0.5deg);
    }
    100% {
        transform: scale(1.02, 0.98) skewX(0.8deg);
    }
}
    </style>
    <link rel="shortcut icon" href="{{ url_for('static', filename='vela-logo-oficial.ico') }}" type="image/x-icon">
</head>
<body class="d-flex">
    
    
    <nav class="sidebar d-flex flex-column p-4">
        <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
    <span class="fs-4 fw-bold d-flex align-items-center">
        
        <i class="fa-solid fa-fire-flame-curved me-2 chama-viva"></i> 
        Velas System
    </span>
</a>


<svg style="width: 0; height: 0; position: absolute;">
    <defs>
        <filter id="distorcao-fogo">
            <feTurbulence type="fractalNoise" baseFrequency="0.04 0.15" numOctaves="3" result="noise">
                <animate attributeName="baseFrequency" values="0.04 0.15; 0.04 0.35; 0.04 0.15" dur="1.2s" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </defs>
</svg>
        <hr class="text-secondary">
        <ul class="nav nav-pills flex-column mb-auto mt-2">
            <li><a href="/" class="nav-link"><i class="fa-solid fa-chart-pie me-3"></i> Visão Geral</a></li>
            <li><a href="/cadastro" class="nav-link active"><i class="fa-solid fa-plus me-3"></i> Cadastrar Vela</a></li>
            <li><a href="/estoque" class="nav-link"><i class="fa-solid fa-box-open me-3"></i> Estoque</a></li>
        </ul>
    </nav>

    
    <div class="main-content p-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="card shadow-lg border-0" style="background-color: #2c2f33;">
                        <div class="card-header text-white" style="background-color: #1a1d20; border-bottom: 2px solid #d4af37;">
                            <h4 class="mb-0 mt-1"><i class="fa-solid fa-wand-magic-sparkles me-2" style="color: #d4af37;"></i> Cadastrar Nova Vela Aromática</h4>
                        </div>
                        <div class="card-body text-white p-4">
                            <form action="/cadastrar" method="POST">
                                <div class="mb-4">
                                    <label for="nome" class="form-label text-light">Nome da Vela</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="nome" name="nome" placeholder="Ex: Brisa do Mar" required>
                                </div>
                                <div class="mb-4">
                                    <label for="aroma" class="form-label text-light">Aroma Principal</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="aroma" name="aroma" placeholder="Ex: Lavanda e Alecrim" required>
                                </div>
                                <div class="mb-4">
                                    <label for="descricao" class="form-label text-light">Descrição (Sensação e Detalhes)</label>
                                    <textarea class="form-control bg-dark text-white border-secondary" id="descricao" name="descricao" rows="3" placeholder="Descreva a sensação que a vela traz..."></textarea>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <label for="preco" class="form-label text-light">Preço (R$)</label>
                                        <input type="number" step="0.01" class="form-control bg-dark text-white border-secondary" id="preco" name="preco" required>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label for="quantidade" class="form-label text-light">Quantidade em Estoque</label>
                                        <input type="number" class="form-control bg-dark text-white border-secondary" id="quantidade" name="quantidade" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn w-100 mt-2" style="background-color: #d4af37; color: black; font-weight: bold; font-size: 1.1rem;">
                                    <i class="fa-solid fa-floppy-disk me-2"></i> Salvar no Sistema
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
