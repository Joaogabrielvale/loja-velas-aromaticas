<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Velas - Dashboard</title>

    <!-- Bootstrap (Nossa biblioteca de Design) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome (Nossa biblioteca de Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Nosso CSS Personalizado do Dashboard -->
    <style>
        body {
            background-color: #212529; /* Fundo principal escuro */
            color: white; 
        }
        
        /* Estilos da Barra Lateral */
        .sidebar {
            width: 260px;
            height: 100vh; /* Ocupa 100% da altura da tela */
            background-color: #1a1d20; /* Um tom um pouquinho mais escuro que o fundo */
            border-right: 2px solid #d4af37; /* Linha dourada/âmbar dividindo a tela */
        }
        
        /* Estilos da Área Principal */
        .main-content {
            flex-grow: 1; /* Ocupa todo o resto do espaço */
            height: 100vh;
            overflow-y: auto; /* Cria barra de rolagem se precisar */
        }
        
        /* Efeito nos botões do menu */
.nav-link {
    color: #adb5bd !important; /* Mantém o cinza elegante por padrão */
    margin-bottom: 10px;
    font-size: 1.1rem;
}
.nav-link:hover {
    color: #d4af37 !important; /* Fica dourado ao passar o mouse */
    background-color: rgba(255, 255, 255, 0.05);
}
.nav-link:focus {
    color: #ffffff !important; /* Fica branco quando você clica (seleciona) */
    outline: none; /* Remove aquela borda/cor azul padrão do navegador */
}
.nav-link.active {
    background-color: #d4af37 !important;
    color: black !important;
    font-weight: bold;
}
        
    </style>
    
    <link rel="shortcut icon" href="/static/vela-logo.ico" type="image/x-icon">
</head>

<!-- O d-flex coloca a barra lateral e o conteúdo lado a lado -->
<body class="d-flex">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <nav class="sidebar d-flex flex-column p-4">
        <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
            <!-- Ícone de chama dourada -->
            <span class="fs-4 fw-bold"><i class="fa-solid fa-fire-flame-curved me-2" style="color: #d4af37;"></i> Velas System</span>
        </a>
        <hr class="text-secondary">
        <ul class="nav nav-pills flex-column mb-auto mt-2">
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fa-solid fa-chart-pie me-3"></i> Visão Geral
                </a>
            </li>
            <li>
                <!-- Este é o botão ativo no momento -->
                <a href="/" class="nav-link active">
                    <i class="fa-solid fa-plus me-3"></i> Cadastrar Vela
                </a>
            </li>
            <li>
                <a href="/estoque" class="nav-link">
                    <i class="fa-solid fa-box-open me-3"></i> Estoque
                </a>
            </li>
        </ul>
    </nav>

    <!-- ÁREA PRINCIPAL (ONDE FICA O FORMULÁRIO) -->
    <div class="main-content p-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    
                    <!-- Cartão do Formulário repaginado -->
                    <div class="card shadow-lg border-0" style="background-color: #2c2f33;">
                        <div class="card-header text-white" style="background-color: #1a1d20; border-bottom: 2px solid #d4af37;">
                            <h4 class="mb-0 mt-1"><i class="fa-solid fa-wand-magic-sparkles me-2" style="color: #d4af37;"></i> Cadastrar Nova Vela Aromática</h4>
                        </div>
                        <div class="card-body text-white p-4">
                            
                            <form action="/cadastrar" method="POST">
                                
                                <div class="mb-4">
                                    <label for="nome" class="form-label text-light">Nome da Vela</label>
                                    <!-- Inputs com fundo escuro para combinar com o sistema -->
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="nome" name="nome" placeholder="Ex: Brisa do Mar" required>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="aroma" class="form-label text-light">Aroma Principal</label>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" id="aroma" name="aroma" placeholder="Ex: Lavanda e Alecrim" required>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="descricao" class="form-label text-light">Descrição (Sensação e Detalhes)</label>
                                    <textarea class="form-control bg-dark text-white border-secondary" id="descricao" name="descricao" rows="3" placeholder="Descreva a sensação que a vela traz..."></textarea>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <label for="preco" class="form-label text-light">Preço (R$)</label>
                                        <input type="number" step="0.01" class="form-control bg-dark text-white border-secondary" id="preco" name="preco" required>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label for="quantidade" class="form-label text-light">Quantidade em Estoque</label>
                                        <input type="number" class="form-control bg-dark text-white border-secondary" id="quantidade" name="quantidade" required>
                                    </div>
                                </div>
                                
                                <!-- Botão Dourado de destaque -->
                                <button type="submit" class="btn w-100 mt-2" style="background-color: #d4af37; color: black; font-weight: bold; font-size: 1.1rem;">
                                    <i class="fa-solid fa-floppy-disk me-2"></i> Salvar no Sistema
                                </button>
                            </form>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
