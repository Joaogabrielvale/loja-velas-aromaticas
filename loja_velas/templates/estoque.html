<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Velas - Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #212529;
            color: white; 
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: #1a1d20;
            border-right: 2px solid #d4af37;
        }
        .main-content {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
        }
        .nav-link {
            color: #adb5bd !important;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .nav-link:hover {
            color: #d4af37 !important;
            background-color: rgba(255, 255, 255, 0.05);
        }
        .nav-link:focus {
            color: #ffffff !important;
            outline: none;
        }
        .nav-link.active {
            background-color: #d4af37 !important;
            color: black !important;
            font-weight: bold;
        }
        
        /* Estilos da Tabela */
        .table-dark {
            background-color: #2c2f33;
        }
    </style>
    <link rel="shortcut icon" href="/static/vela-logo.ico" type="image/x-icon">
</head>
<body class="d-flex">

    <nav class="sidebar d-flex flex-column p-4">
        <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none">
            <span class="fs-4 fw-bold"><i class="fa-solid fa-fire-flame-curved me-2" style="color: #d4af37;"></i> Velas System</span>
        </a>
        <hr class="text-secondary">
        <ul class="nav nav-pills flex-column mb-auto mt-2">
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fa-solid fa-chart-pie me-3"></i> Visão Geral
                </a>
            </li>
            <li>
                <a href="/" class="nav-link">
                    <i class="fa-solid fa-plus me-3"></i> Cadastrar Vela
                </a>
            </li>
            <li>
                <!-- Botão de Estoque agora está Ativo -->
                <a href="/estoque" class="nav-link active">
                    <i class="fa-solid fa-box-open me-3"></i> Estoque
                </a>
            </li>
        </ul>
    </nav>

    <div class="main-content p-5">
        <div class="container">
            <h3 class="mb-4"><i class="fa-solid fa-box-open me-2" style="color: #d4af37;"></i> Controle de Estoque</h3>
            
            <div class="card shadow-lg border-0" style="background-color: #2c2f33;">
                <div class="card-body p-0">
                    <table class="table table-dark table-hover mb-0">
                        <thead style="border-bottom: 2px solid #d4af37;">
                            <tr>
                                <th>ID</th>
                                <th>Nome da Vela</th>
                                <th>Aroma</th>
                                <th>Preço</th>
                                <th>Qtd.</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- O Python vai injetar as velas aqui automaticamente -->
                            {% for vela in velas %}
                            <tr>
                                <td>{{ vela.id }}</td>
                                <td>{{ vela.nome }}</td>
                                <td>{{ vela.aroma }}</td>
                                <td>R$ {{ vela.preco }}</td>
                                <td>{{ vela.quantidade }} un.</td>
                                <td>
                                    <!-- O botão de Editar que usaremos na próxima etapa -->
                                    <a href="/editar/{{ vela.id }}" class="btn btn-sm btn-outline-warning">
                                        <i class="fa-solid fa-pen-to-square"></i> Editar
                                    </a>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
